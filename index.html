<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeAI | AI VibeCoding Challenges</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <header>
            <nav>
                <div class="logo">Vibe<span>AI</span></div>
                <div class="nav-links">
                    <a href="/" class="active">Challenges</a>
                    <a href="/participants.html">Participants</a>
                </div>
            </nav>
        </header>

        <main>
            <section class="hero">
                <h1>AI VibeCoding <br><span>Challenges</span></h1>
                <p>Push the boundaries of AI. Solve the unsolvable. Grab the prize.</p>
                <div class="hero-glow"></div>
            </section>

            <section class="challenges">
                <div class="section-header">
                    <h2>Active Challenges</h2>
                    <p>Select a challenge to begin your journey.</p>
                </div>
                <div id="challenge-grid" class="grid">
                    <!-- Challenges will be loaded here -->
                    <div class="loading">Aligning vibes...</div>
                </div>
            </section>
        </main>

        <!-- Application Modal -->
        <div id="apply-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2 id="modal-title">Apply for Challenge</h2>
                <form id="apply-form">
                    <input type="hidden" id="challenge-id">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="github">GitHub Profile</label>
                        <input type="url" id="github" required placeholder="https://github.com/johndoe">
                    </div>
                    <div class="form-group">
                        <label for="eligibility">Vibe Eligibility / AI Experience</label>
                        <textarea id="eligibility" rows="2" required placeholder="Briefly describe why you are eligible for this vibe..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="message">Why you?</label>
                        <textarea id="message" rows="3" placeholder="Tell us more..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Submit Application</button>
                </form>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 VibeAI. All vibes reserved.</p>
        </footer>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
